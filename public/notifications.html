<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){for(var r of rs){r.unregister();}});}if("caches" in window){caches.keys().then(function(ks){for(var k of ks){caches.delete(k);}});}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications | GharKaam</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <link href="/css/bootstrap.min.css?v=3" rel="stylesheet">
  <link href="/css/bootstrap-icons.min.css?v=3" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=3">
</head>
<body class="bg-light">

  <header id="navbar-placeholder"></header>

  <main class="py-5">
    <div class="container" style="max-width: 800px;">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="h3 fw-bold mb-1">Your Notifications</h2>
          <p class="text-muted small mb-0">Updates on your bookings, requests, ratings, and account alerts.</p>
        </div>
        <button class="btn btn-outline-success btn-sm fw-bold" id="markAllReadBtn">
          <i class="bi bi-check-all me-1"></i> Mark All as Read
        </button>
      </div>

      <div class="gk-card p-2 p-md-3" id="notificationsListCard">
        <div class="text-center py-5">
          <div class="spinner-border text-success"></div>
          <p class="text-muted small mt-2">Loading notifications...</p>
        </div>
      </div>
    </div>
  </main>

  <footer id="footer-placeholder"></footer>

  <script src="/js/bootstrap.bundle.min.js?v=3"></script>
  <script src="/js/api.js"></script>
  <script src="/js/shared.js"></script>
  <script src="/js/notifications.js"></script>
</body>
</html>
