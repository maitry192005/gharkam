<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){for(var r of rs){r.unregister();}});}if("caches" in window){caches.keys().then(function(ks){for(var k of ks){caches.delete(k);}});}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password | GharKaam</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <link href="/css/bootstrap.min.css?v=3" rel="stylesheet">
  <link href="/css/bootstrap-icons.min.css?v=3" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=3">
</head>
<body class="bg-light">

  <header id="navbar-placeholder"></header>

  <main class="py-5 d-flex align-items-center">
    <div class="container" style="max-width: 480px;">
      <div class="gk-card p-4 p-md-5 shadow-sm">
        <div class="text-center mb-4">
          <h2 class="h4 fw-bold">Set New Password</h2>
          <p class="text-muted small">Choose a secure new password for your GharKaam account.</p>
        </div>

        <div id="resetAlert" class="alert d-none mb-3"></div>

        <form id="resetForm">
          <div class="mb-3">
            <label for="newPassword" class="form-label small fw-semibold">New Password</label>
            <input type="password" class="form-control" id="newPassword" required minlength="6" placeholder="At least 6 characters">
          </div>

          <div class="mb-3">
            <label for="confirmNewPassword" class="form-label small fw-semibold">Confirm New Password</label>
            <input type="password" class="form-control" id="confirmNewPassword" required placeholder="Re-enter new password">
          </div>

          <button type="submit" id="resetBtn" class="btn btn-brand-primary w-100 py-2 fw-bold">
            Update Password
          </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center small text-muted">
          <a href="/login.html" class="text-success fw-bold text-decoration-none">Back to Login</a>
        </div>
      </div>
    </div>
  </main>

  <footer id="footer-placeholder"></footer>

  <script src="/js/bootstrap.bundle.min.js?v=3"></script>
  <script src="/js/api.js"></script>
  <script src="/js/shared.js"></script>
  <script>
    document.getElementById('resetForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      const email = urlParams.get('email');

      const newPassword = document.getElementById('newPassword').value;
      const confirmNew = document.getElementById('confirmNewPassword').value;
      const alertBox = document.getElementById('resetAlert');
      const btn = document.getElementById('resetBtn');

      if (newPassword !== confirmNew) {
        alertBox.className = 'alert alert-danger show';
        alertBox.textContent = 'Passwords do not match.';
        alertBox.classList.remove('d-none');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Updating...';
      alertBox.classList.add('d-none');

      try {
        const res = await api.post('/auth/reset-password', { token, email, password: newPassword });
        alertBox.className = 'alert alert-success show';
        alertBox.textContent = res.message || 'Password updated successfully! Redirecting to login...';
        alertBox.classList.remove('d-none');
        setTimeout(() => {
          window.location.href = '/login.html';
        }, 1500);
      } catch (err) {
        alertBox.className = 'alert alert-danger show';
        alertBox.textContent = err.message || 'Failed to reset password. Link may be invalid or expired.';
        alertBox.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Update Password';
      }
    });
  </script>
</body>
</html>
