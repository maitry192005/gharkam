<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){for(var r of rs){r.unregister();}});}if("caches" in window){caches.keys().then(function(ks){for(var k of ks){caches.delete(k);}});}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | GharKaam</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <link href="/css/bootstrap.min.css?v=3" rel="stylesheet">
  <link href="/css/bootstrap-icons.min.css?v=3" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=3">
</head>
<body class="bg-light">

  <header id="navbar-placeholder"></header>

  <main class="py-5 d-flex align-items-center">
    <div class="container" style="max-width: 480px;">
      <div class="gk-card p-4 p-md-5 shadow-sm">
        <div class="text-center mb-4">
          <div class="rounded-circle d-inline-flex align-items-center justify-content-center p-3 bg-success bg-opacity-10 text-success mb-2" style="width: 60px; height: 60px;">
            <i class="bi bi-key-fill fs-3"></i>
          </div>
          <h2 class="h4 fw-bold">Reset Your Password</h2>
          <p class="text-muted small">Enter your registered email and we'll send a password recovery link.</p>
        </div>

        <div id="forgotAlert" class="alert d-none mb-3"></div>

        <form id="forgotForm">
          <div class="mb-3">
            <label for="forgotEmail" class="form-label small fw-semibold">Registered Email</label>
            <input type="email" class="form-control" id="forgotEmail" required placeholder="name@example.com">
          </div>

          <button type="submit" id="forgotBtn" class="btn btn-brand-primary w-100 py-2 fw-bold">
            Send Reset Instructions
          </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center small text-muted">
          Remember your password? <a href="/login.html" class="text-success fw-bold text-decoration-none">Back to Login</a>
        </div>
      </div>
    </div>
  </main>

  <footer id="footer-placeholder"></footer>

  <script src="/js/bootstrap.bundle.min.js?v=3"></script>
  <script src="/js/api.js"></script>
  <script src="/js/shared.js"></script>
  <script>
    document.getElementById('forgotForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('forgotEmail').value.trim();
      const alertBox = document.getElementById('forgotAlert');
      const btn = document.getElementById('forgotBtn');

      btn.disabled = true;
      btn.textContent = 'Sending link...';
      alertBox.classList.add('d-none');

      try {
        const res = await api.post('/auth/forgot-password', { email });
        alertBox.className = 'alert alert-success show';
        alertBox.textContent = res.message || 'Password reset link sent to your email address.';
        alertBox.classList.remove('d-none');
      } catch (err) {
        alertBox.className = 'alert alert-danger show';
        alertBox.textContent = err.message || 'Could not send reset instructions.';
        alertBox.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Reset Instructions';
      }
    });
  </script>
</body>
</html>
