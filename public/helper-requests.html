<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){for(var r of rs){r.unregister();}});}if("caches" in window){caches.keys().then(function(ks){for(var k of ks){caches.delete(k);}});}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Requests | GharKaam</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <link href="/css/bootstrap.min.css?v=3" rel="stylesheet">
  <link href="/css/bootstrap-icons.min.css?v=3" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=3">
</head>
<body class="bg-light">

  <header id="navbar-placeholder"></header>

  <div class="dashboard-container">
    <aside class="dashboard-sidebar">
      <div class="d-flex align-items-center gap-3 px-3 py-2 mb-2">
        <div id="helperSideAvatarContainer"><div class="avatar-circle">GK</div></div>
        <div class="overflow-hidden">
          <div class="fw-bold text-truncate" id="helperSideName">Helper</div>
          <div class="text-muted small">Service Partner</div>
        </div>
      </div>
      <hr class="my-2 text-muted">
      <nav class="d-flex flex-column gap-1">
        <a href="/helper-dashboard.html" class="sidebar-nav-item"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="/helper-requests.html" class="sidebar-nav-item active"><i class="bi bi-inbox-fill"></i> Requests & Jobs</a>
        <a href="/helper-schedule.html" class="sidebar-nav-item"><i class="bi bi-calendar-week"></i> My Schedule</a>
        <a href="/helper-services.html" class="sidebar-nav-item"><i class="bi bi-gear-wide-connected"></i> Services & Rates</a>
        <a href="/helper-earnings.html" class="sidebar-nav-item"><i class="bi bi-cash-stack text-success"></i> Earnings & Payouts</a>
        <a href="/helper-reviews.html" class="sidebar-nav-item"><i class="bi bi-star-fill text-warning"></i> Customer Reviews</a>
        <a href="/helper-profile-edit.html" class="sidebar-nav-item"><i class="bi bi-person-badge"></i> Profile Details</a>
        <a href="/notifications.html" class="sidebar-nav-item"><i class="bi bi-bell"></i> Notifications</a>
        <button type="button" class="sidebar-nav-item border-0 bg-transparent text-danger mt-3" onclick="api.logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
      </nav>
    </aside>

    <main class="dashboard-content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="h3 fw-bold mb-1">Customer Requests & Jobs</h2>
          <p class="text-muted small mb-0">Accept or decline new requests, track in-progress jobs, and complete tasks.</p>
        </div>
      </div>

      <!-- Status Tabs -->
      <ul class="nav nav-pills mb-4 gap-2" id="helperStatusTabs">
        <li class="nav-item">
          <button class="nav-link active rounded-pill px-3 py-1 small" data-status="pending">Pending Requests</button>
        </li>
        <li class="nav-item">
          <button class="nav-link rounded-pill px-3 py-1 small" data-status="accepted">Accepted Jobs</button>
        </li>
        <li class="nav-item">
          <button class="nav-link rounded-pill px-3 py-1 small" data-status="in-progress">In-Progress</button>
        </li>
        <li class="nav-item">
          <button class="nav-link rounded-pill px-3 py-1 small" data-status="completed">Completed History</button>
        </li>
        <li class="nav-item">
          <button class="nav-link rounded-pill px-3 py-1 small" data-status="declined">Declined</button>
        </li>
      </ul>

      <!-- Requests Grid -->
      <div class="row g-4" id="helperRequestsContainer">
        <div class="col-12 text-center py-5">
          <div class="spinner-border text-success"></div>
          <p class="text-muted small mt-2">Loading requests...</p>
        </div>
      </div>
    </main>
  </div>

  <footer id="footer-placeholder"></footer>

  <script src="/js/bootstrap.bundle.min.js?v=3"></script>
  <script src="/js/api.js"></script>
  <script src="/js/shared.js"></script>
  <script src="/js/helper-requests.js"></script>
</body>
</html>
