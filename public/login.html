<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){for(var r of rs){r.unregister();}});}if("caches" in window){caches.keys().then(function(ks){for(var k of ks){caches.delete(k);}});}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | GharKaam</title>
  <meta name="description" content="Sign in to your GharKaam account to manage bookings, household helpers, schedule jobs, and track earnings.">
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <link href="/css/bootstrap.min.css?v=3" rel="stylesheet">
  <link href="/css/bootstrap-icons.min.css?v=3" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=3">
</head>
<body class="bg-light">

  <!-- Universal Navbar -->
  <header id="navbar-placeholder"></header>

  <main class="py-5 d-flex align-items-center">
    <div class="container" style="max-width: 480px;">
      <div class="gk-card p-4 p-md-5 shadow-sm">
        <div class="text-center mb-4">
          <img src="/assets/images/Gharkaam Logo.png" alt="GharKaam Logo" style="height: 50px;" class="mb-3">
          <h2 class="h3 fw-bold mb-1">Welcome Back</h2>
          <p class="text-muted small">Enter your credentials to access your GharKaam account</p>
        </div>

        <div id="loginAlert" class="alert d-none mb-3" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="loginId" class="form-label small fw-semibold">Email or Username</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent"><i class="bi bi-person text-muted"></i></span>
              <input type="text" class="form-control" id="loginId" required placeholder="e.g. ananya@example.com or admin">
            </div>
            <div class="invalid-feedback">Please enter your username or registered email.</div>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between">
              <label for="loginPassword" class="form-label small fw-semibold">Password</label>
              <a href="/forgot-password.html" class="small text-success text-decoration-none">Forgot password?</a>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-transparent"><i class="bi bi-lock text-muted"></i></span>
              <input type="password" class="form-control" id="loginPassword" required placeholder="Enter password">
              <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn">
                <i class="bi bi-eye" id="eyeIcon"></i>
              </button>
            </div>
            <div class="invalid-feedback">Password is required.</div>
          </div>

          <button type="submit" id="loginSubmitBtn" class="btn btn-brand-primary w-100 py-2 fw-bold mt-2">
            <span id="btnText">Sign In</span>
            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
          </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center small text-muted">
          Don't have an account yet? <a href="/register.html" class="text-success fw-bold text-decoration-none">Create Account</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Universal Footer -->
  <footer id="footer-placeholder"></footer>

  <!-- Scripts -->
  <script src="/js/bootstrap.bundle.min.js?v=3"></script>
  <script src="/js/api.js"></script>
  <script src="/js/shared.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
