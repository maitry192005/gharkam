<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){for(var r of rs){r.unregister();}});}if("caches" in window){caches.keys().then(function(ks){for(var k of ks){caches.delete(k);}});}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Details | GharKaam</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <link href="/css/bootstrap.min.css?v=3" rel="stylesheet">
  <link href="/css/bootstrap-icons.min.css?v=3" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=3">
</head>
<body class="bg-light">

  <header id="navbar-placeholder"></header>

  <main class="py-5">
    <div class="container" style="max-width: 980px;">
      <!-- Breadcrumb & Back Link -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <a href="javascript:history.back()" class="text-decoration-none text-muted small">
          <i class="bi bi-arrow-left me-1"></i> Back to Bookings
        </a>
        <div id="bookingStatusBadgeContainer"></div>
      </div>

      <div id="bookingDetailView">
        <div class="text-center py-5">
          <div class="spinner-border text-success"></div>
          <p class="text-muted small mt-2">Loading booking details...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Review Modal -->
  <div class="modal fade" id="reviewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Leave a Review for Your Helper</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="reviewSubmitForm">
          <div class="modal-body">
            <div class="mb-3 text-center">
              <label class="form-label small fw-semibold d-block">Overall Rating</label>
              <div class="stars-rating fs-3 cursor-pointer" id="ratingStarsSelector">
                <i class="bi bi-star-fill text-warning" data-val="1"></i>
                <i class="bi bi-star-fill text-warning" data-val="2"></i>
                <i class="bi bi-star-fill text-warning" data-val="3"></i>
                <i class="bi bi-star-fill text-warning" data-val="4"></i>
                <i class="bi bi-star-fill text-warning" data-val="5"></i>
              </div>
              <input type="hidden" id="reviewRatingVal" value="5">
            </div>

            <div class="mb-3">
              <label for="reviewCommentText" class="form-label small fw-semibold">Your Experience & Feedback</label>
              <textarea class="form-control" id="reviewCommentText" rows="4" required placeholder="Describe punctuality, quality of work, cleanliness, and communication..."></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-brand-primary btn-sm" id="submitReviewBtn">Submit Review</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Complaint / Dispute Modal -->
  <div class="modal fade" id="complaintModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold text-danger">Report an Issue on Booking</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="complaintSubmitForm">
          <div class="modal-body">
            <div class="mb-3">
              <label for="complaintSubject" class="form-label small fw-semibold">Issue Type</label>
              <select class="form-select form-select-sm" id="complaintSubject" required>
                <option value="Helper was late / absent">Helper was late / absent</option>
                <option value="Quality of work did not meet expectations">Quality of work did not meet expectations</option>
                <option value="Misbehavior or unprofessional conduct">Misbehavior or unprofessional conduct</option>
                <option value="Billing discrepancy">Billing discrepancy</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="complaintDescription" class="form-label small fw-semibold">Description</label>
              <textarea class="form-control" id="complaintDescription" rows="4" required placeholder="Please describe what went wrong so customer safety can assist you..."></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-danger btn-sm" id="submitComplaintBtn">Submit Report</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <footer id="footer-placeholder"></footer>

  <script src="/js/bootstrap.bundle.min.js?v=3"></script>
  <script src="/js/api.js"></script>
  <script src="/js/shared.js"></script>
  <script src="/js/booking-detail.js"></script>
</body>
</html>
